services:
  # =========================================================================
  # Database Service: PostgreSQL 16
  # =========================================================================
  db:
    image: postgres:16.4-alpine
    container_name: portail_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Les quotes sont obligatoires : sans elles, le « : » du message d'erreur
      # est interprete par YAML comme un debut de mapping et le fichier ne parse pas.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}"
      POSTGRES_DB: ${POSTGRES_DB:-portail_client}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portail_client}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: Database is isolated inside backend_net and NOT exposed to host ports
    security_opt:
      - no-new-privileges:true

  # =========================================================================
  # Backend API Service: FastAPI
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portail_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-portail_client}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portail_client}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY doit etre defini dans .env (openssl rand -hex 32)}"
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      UPLOAD_DIR: /uploads
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./uploads:/uploads
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 40s : le conteneur applique les migrations Alembic avant d'ouvrir le port.
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # =========================================================================
  # Frontend Web Service: build statique React servi par Nginx
  # =========================================================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portail_web
    restart: unless-stopped
    # Securite : le frontend n'a besoin que du reseau public, jamais de la base
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # =========================================================================
  # Reverse Proxy & TLS: Caddy
  # =========================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: portail_caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC) support
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      # La directive `email` du Caddyfile exige un argument : une valeur vide
      # ferait echouer le parsing et Caddy ne demarrerait pas. Le repli permet un
      # demarrage en local ; sur un vrai domaine, renseignez CADDY_EMAIL dans .env
      # sans quoi Let's Encrypt n'a aucune adresse pour vous prevenir d'un probleme.
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true

# =========================================================================
# Networks Definition (Security Isolation)
# =========================================================================
networks:
  # Internal network: only backend and db can communicate; no public routing
  backend_net:
    driver: bridge
    internal: true
  # Frontend network: Caddy dialogue avec le frontend (web) et le backend
  frontend_net:
    driver: bridge

# =========================================================================
# Persistent Volumes
# =========================================================================
volumes:
  pgdata:
    name: portail_pgdata
  caddy_data:
    name: portail_caddy_data
  caddy_config:
    name: portail_caddy_config
