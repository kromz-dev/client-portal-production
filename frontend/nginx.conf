server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Les routes /api/* et /health sont traitees par Caddy en amont :
    # elles n'atteignent jamais ce conteneur, qui ne sert que le SPA.

    # Cache long pour les assets Vite (noms de fichiers avec empreinte/hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais etre mis en cache : les deploiements sont pris
    # en compte immediatement
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
