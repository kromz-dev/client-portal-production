# Configuration Alembic pour le Portail Client.
# L'URL de la base n'est PAS renseignée ici : elle est fournie dynamiquement
# par migrations/env.py à partir de config.settings.database_url.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
